    <script>
      // Safe polyfill/accessor for window.fetch to prevent errors from Chrome extension interceptors
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return originalFetch;
            },
            set: function(newFetch) {
              originalFetch = newFetch;
            }
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var origProtoFetch = window.fetch;
              Object.defineProperty(proto, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return origProtoFetch;
                },
                set: function(newFetch) {
                  origProtoFetch = newFetch;
                }
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
